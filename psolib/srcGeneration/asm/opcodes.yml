opcodes:
  - code: 0x00
    mnemonic: nop
    doc: No operation, does nothing.
    params: []

  - code: 0x01
    mnemonic: ret
    doc: Returns control to caller.
    params: []

  - code: 0x02
    mnemonic: sync
    doc: Yields control for the rest of the current frame. Execution will continue the following frame.
    params: []

  - code: 0x03
    mnemonic: exit
    doc: "Exits entirely"
    params:
      - type: int
    stack: pop

  - code: 0x04
    mnemonic: thread
    doc: |-
        Starts a new thread. Thread execution will start at the given label.
        Often used to check a register every frame. Make sure to yield control with sync when looping.
    params:
      - type: ilabel

  - code: 0x05
    mnemonic: va_start
    doc: |-
        Initializes a variable argument list.
        Make sure to call va_end after va_start and va_call.
    params: []

  - code: 0x06
    mnemonic: va_end
    doc: |-
        Restores the registers overwritten by arg_push* instructions.
        Called after va_call.
    params: []

  - code: 0x07
    mnemonic: va_call
    doc: |-
        Calls the variable argument function at the given label.
        Called after initializing the argument list with va_start and pushing arguments onto the stack with arg_push* instructions. Make sure to call va_end afterwards.
    params:
      - type: ilabel

  - code: 0x08
    mnemonic: let
    doc: Sets a register to a given register's value.
    params:
      - type: reg
        registers:
          - type: int
            write: true
      - type: reg
        registers:
          - type: int
            read: true

  - code: 0x09
    mnemonic: leti
    doc: Sets a register to the given value.
    params:
      - type: reg
        registers:
          - type: int
            write: true
      - type: int

  - code: 0x0a
    mnemonic: letb
    doc: Sets a register to the given value.
    params:
      - type: reg
        registers:
          - type: byte
            write: true
      - type: byte

  - code: 0x0b
    mnemonic: letw
    doc: Sets a register to the given value.
    params:
      - type: reg
        registers:
          - type: short
            write: true
      - type: short

  - code: 0x0c
    mnemonic: leta
    doc: Sets a register to the memory address of a given register. Not used by Sega.
    params:
      - type: reg
        registers:
          - type: pointer
            write: true
      - type: reg
        registers:
          - type: any
            read: true

  - code: 0x0d
    mnemonic: leto
    doc: Sets a register to the memory address of the given label. Not used by Sega.
    params:
      - type: reg
        registers:
          - type: pointer
            write: true
      - type: label

  - code: 0x10
    mnemonic: set
    doc: Sets a register to 1.
    params:
      - type: reg
        registers:
          - type: int
            write: true

  - code: 0x11
    mnemonic: clear
    doc: Sets a register to 0.
    params:
      - type: reg
        registers:
          - type: int
            write: true

  - code: 0x12
    mnemonic: rev
    doc: Sets a register to 1 if its current value is 0, otherwise sets it to 0.
    params:
      - type: reg
        registers:
          - type: int
            read: true
            write: true

  - code: 0x13
    mnemonic: gset
    doc: "Sets flagA to 1. Sends 6x75."
    params:
      - type: short

  - code: 0x14
    mnemonic: gclear
    doc: "Clears flagA to 0. Sends 6x75 on BB, but does not send anything on other versions."
    params:
      - type: short

  - code: 0x15
    mnemonic: grev
    doc: "Inverts flagA. Like the above two opcodes, sends 6x75 if the flag is set by this opcode. Only BB sends 6x75 if the flag is cleared by this opcode."
    params:
      - type: short

  - code: 0x16
    mnemonic: glet
    doc: "If regB is nonzero, sets flagA; otherwise, clears it"
    params:
      - type: short
        name: "flag"
      - type: reg
        registers:
          - type: int
            read: true

  - code: 0x17
    mnemonic: gget
    doc: Sets a register to value of the given flag.
    params:
      - type: short
      - type: reg
        registers:
          - type: short
            write: true

  - code: 0x18
    mnemonic: add
    doc: "regA += regB"
    params:
      - type: reg
        registers:
          - type: int
            read: true
            write: true
      - type: reg
        registers:
          - type: int
            read: true

  - code: 0x19
    mnemonic: addi
    doc: "regA += valueB"
    params:
      - type: reg
        registers:
          - type: int
            write: true
      - type: int

  - code: 0x1a
    mnemonic: sub
    doc: "regA -= regB"
    params:
      - type: reg
        registers:
          - type: int
            read: true
            write: true
      - type: reg
        registers:
          - type: int
            read: true

  - code: 0x1b
    mnemonic: subi
    doc: "regA -= valueB"
    params:
      - type: reg
        registers:
          - type: int
            write: true
      - type: int

  - code: 0x1c
    mnemonic: mul
    doc: "regA *= regB"
    params:
      - type: reg
        registers:
          - type: int
            read: true
            write: true
      - type: reg
        registers:
          - type: int
            read: true

  - code: 0x1d
    mnemonic: muli
    doc: "regA *= valueB"
    params:
      - type: reg
        registers:
          - type: int
            write: true
      - type: int

  - code: 0x1e
    mnemonic: div
    doc: "regA /= regB"
    params:
      - type: reg
        registers:
          - type: int
            read: true
            write: true
      - type: reg
        registers:
          - type: int
            read: true

  - code: 0x1f
    mnemonic: divi
    doc: "regA /= valueB"
    params:
      - type: reg
        registers:
          - type: int
            write: true
      - type: int

  - code: 0x20
    mnemonic: and
    doc: "regA &= regB"
    params:
      - type: reg
        registers:
          - type: int
            read: true
            write: true
      - type: reg
        registers:
          - type: int
            read: true

  - code: 0x21
    mnemonic: andi
    doc: "regA &= valueB"
    params:
      - type: reg
        registers:
          - type: int
            write: true
      - type: int

  - code: 0x22
    mnemonic: or
    doc: "regA |= regB"
    params:
      - type: reg
        registers:
          - type: int
            read: true
            write: true
      - type: reg
        registers:
          - type: int
            read: true

  - code: 0x23
    mnemonic: ori
    doc: "regA |= valueB"
    params:
      - type: reg
        registers:
          - type: int
            write: true
      - type: int

  - code: 0x24
    mnemonic: xor
    doc: "regA ^= regB"
    params:
      - type: reg
        registers:
          - type: int
            read: true
            write: true
      - type: reg
        registers:
          - type: int
            read: true

  - code: 0x25
    mnemonic: xori
    doc: "regA ^= valueB"
    params:
      - type: reg
        registers:
          - type: int
            write: true
      - type: int

  - code: 0x26
    mnemonic: mod
    doc: "regA %= regB Note: This does signed division, so if the value is negative, you might get unexpected results."
    params:
      - type: reg
        registers:
          - type: int
            read: true
            write: true
      - type: reg
        registers:
          - type: int
            read: true

  - code: 0x27
    mnemonic: modi
    doc: "regA %= valueB Note: Unlike mod, this does unsigned division."
    params:
      - type: reg
        registers:
          - type: int
            write: true
      - type: int

  - code: 0x28
    mnemonic: jmp
    doc: "Jumps to labelA"
    params:
      - type: ilabel

  - code: 0x29
    mnemonic: call
    doc: "Pushes the script offset immediately after this opcode and jumps to labelA Note: This opcode doesn't directly clear the args list, but we assume during disassembly that the code being called does so."
    params:
      - type: ilabel

  - code: 0x2a
    mnemonic: jmp_on
    doc: "If all values in regsB are nonzero, jumps to labelA"
    params:
      - type: ilabel
      - type: reg_var
        read: true

  - code: 0x2b
    mnemonic: jmp_off
    doc: "If all values in regsB are zero, jumps to labelA"
    params:
      - type: ilabel
      - type: reg_var
        read: true

  - code: 0x2c
    mnemonic: jmp_=
    doc: "If regA == regB, jumps to labelC"
    params:
      - type: reg
        registers:
          - type: any
            read: true
      - type: reg
        registers:
          - type: any
            read: true
      - type: ilabel

  - code: 0x2d
    mnemonic: jmpi_=
    doc: "If regA == valueB, jumps to labelC"
    params:
      - type: reg
        registers:
          - type: int
            read: true
      - type: int
      - type: ilabel

  - code: 0x2e
    mnemonic: jmp_!=
    doc: "If regA != regB, jumps to labelC"
    params:
      - type: reg
        registers:
          - type: any
            read: true
      - type: reg
        registers:
          - type: any
            read: true
      - type: ilabel

  - code: 0x2f
    mnemonic: jmpi_!=
    doc: "If regA != valueB, jumps to labelC"
    params:
      - type: reg
        registers:
          - type: int
            read: true
      - type: int
      - type: ilabel

  - code: 0x30
    mnemonic: ujmp_>
    doc: "If regA > regB (unsigned), jumps to labelC"
    params:
      - type: reg
        registers:
          - type: int
            read: true
      - type: reg
        registers:
          - type: int
            read: true
      - type: ilabel

  - code: 0x31
    mnemonic: ujmpi_>
    doc: "If regA > valueB (unsigned), jumps to labelC"
    params:
      - type: reg
        registers:
          - type: int
            read: true
      - type: int
      - type: ilabel

  - code: 0x32
    mnemonic: jmp_>
    doc: "If regA > regB (signed), jumps to labelC"
    params:
      - type: reg
        registers:
          - type: int
            read: true
      - type: reg
        registers:
          - type: int
            read: true
      - type: ilabel

  - code: 0x33
    mnemonic: jmpi_>
    doc: "If regA > valueB (signed), jumps to labelC"
    params:
      - type: reg
        registers:
          - type: int
            read: true
      - type: int
      - type: ilabel

  - code: 0x34
    mnemonic: ujmp_<
    doc: "If regA < regB (unsigned), jumps to labelC"
    params:
      - type: reg
        registers:
          - type: int
            read: true
      - type: reg
        registers:
          - type: int
            read: true
      - type: ilabel

  - code: 0x35
    mnemonic: ujmpi_<
    doc: "If regA < valueB (unsigned), jumps to labelC"
    params:
      - type: reg
        registers:
          - type: int
            read: true
      - type: int
      - type: ilabel

  - code: 0x36
    mnemonic: jmp_<
    doc: "If regA < regB (signed), jumps to labelC"
    params:
      - type: reg
        registers:
          - type: int
            read: true
      - type: reg
        registers:
          - type: int
            read: true
      - type: ilabel

  - code: 0x37
    mnemonic: jmpi_<
    doc: "If regA < valueB (signed), jumps to labelC"
    params:
      - type: reg
        registers:
          - type: int
            read: true
      - type: int
      - type: ilabel

  - code: 0x38
    mnemonic: ujmp_>=
    doc: "If regA >= regB (unsigned), jumps to labelC"
    params:
      - type: reg
        registers:
          - type: int
            read: true
      - type: reg
        registers:
          - type: int
            read: true
      - type: ilabel

  - code: 0x39
    mnemonic: ujmpi_>=
    doc: "If regA >= valueB (unsigned), jumps to labelC"
    params:
      - type: reg
        registers:
          - type: int
            read: true
      - type: int
      - type: ilabel

  - code: 0x3a
    mnemonic: jmp_>=
    doc: "If regA >= regB (signed), jumps to labelC"
    params:
      - type: reg
        registers:
          - type: int
            read: true
      - type: reg
        registers:
          - type: int
            read: true
      - type: ilabel

  - code: 0x3b
    mnemonic: jmpi_>=
    doc: "If regA >= valueB (signed), jumps to labelC"
    params:
      - type: reg
        registers:
          - type: int
            read: true
      - type: int
      - type: ilabel

  - code: 0x3c
    mnemonic: ujmp_<=
    doc: "If regA <= regB (unsigned), jumps to labelC"
    params:
      - type: reg
        registers:
          - type: int
            read: true
      - type: reg
        registers:
          - type: int
            read: true
      - type: ilabel

  - code: 0x3d
    mnemonic: ujmpi_<=
    doc: "If regA <= valueB (unsigned), jumps to labelC"
    params:
      - type: reg
        registers:
          - type: int
            read: true
      - type: int
      - type: ilabel

  - code: 0x3e
    mnemonic: jmp_<=
    doc: "If regA <= regB (signed), jumps to labelC"
    params:
      - type: reg
        registers:
          - type: int
            read: true
      - type: reg
        registers:
          - type: int
            read: true
      - type: ilabel

  - code: 0x3f
    mnemonic: jmpi_<=
    doc: "If regA <= valueB (signed), jumps to labelC"
    params:
      - type: reg
        registers:
          - type: int
            read: true
      - type: int
      - type: ilabel

  - code: 0x40
    mnemonic: switch_jmp
    doc: "Jumps to labelsB[regA]; if regA is out of range of labelsB, does nothing"
    params:
      - type: reg
        registers:
          - type: int
            read: true
      - type: ilabel_var

  - code: 0x41
    mnemonic: switch_call
    doc: "Calls labelsB[regA]; if regA is out of range of labelsB, does nothing Note: This opcode doesn't directly clear the args list, but we assume during disassembly that the code being called does so."
    params:
      - type: reg
        registers:
          - type: int
            read: true
      - type: ilabel_var

  - code: 0x42
    mnemonic: stack_push
    doc: "Does nothing"
    params:
      - type: reg
        registers:
          - type: any
            read: true

  - code: 0x43
    mnemonic: stack_pop
    doc: "Pops a value from the stack and puts it into regA"
    params:
      - type: reg
        registers:
          - type: any
            write: true

  - code: 0x44
    mnemonic: stack_pushm
    doc: Pushes the values of an arbitrary amount of registers onto the stack.
    params:
      - type: reg
        read: true
      - type: int

  - code: 0x45
    mnemonic: stack_popm
    doc: Pops an arbitrary amount of values from the stack and writes them to registers.
    params:
      - type: reg
        write: true
      - type: int

  - code: 0x48
    mnemonic: arg_pushr
    doc: Pushes the value of the given register onto the stack.
    params:
      - type: reg
        registers:
          - type: any
            read: true
    stack: push

  - code: 0x49
    mnemonic: arg_pushl
    doc: Pushes the given value onto the stack.
    params:
      - type: int
    stack: push

  - code: 0x4a
    mnemonic: arg_pushb
    doc: Pushes the given value onto the stack.
    params:
      - type: byte
    stack: push

  - code: 0x4b
    mnemonic: arg_pushw
    doc: Pushes the given value onto the stack.
    params:
      - type: short
    stack: push

  - code: 0x4c
    mnemonic: arg_pusha
    doc: Pushes the memory address of the given register onto the stack. Not used by Sega.
    params:
      - type: reg
        registers:
          - type: any
            read: true
    stack: push

  - code: 0x4d
    mnemonic: arg_pusho
    doc: Pushes the memory address of the given label onto the stack. Not used by Sega.
    params:
      - type: label
    stack: push

  - code: 0x4e
    mnemonic: arg_pushs
    doc: Pushes the given value onto the stack.
    params:
      - type: string
    stack: push

  - code: 0x4f
    mnemonic: unknown_4f
    params:
      - type: reg
        registers:
          - type: int
            read: true
      - type: reg
        registers:
          - type: int
            read: true

  - code: 0x50
    mnemonic: message
    doc: "Creates dialogue with an object/NPC (valueA) starting with message strB"
    params:
      - type: int
      - type: string
    stack: pop

  - code: 0x51
    mnemonic: list
    doc: |-
        Used to display a list of items and retrieve the item selected by the player.
        List items should be seperated by newlines. The selected item's index will be written to the given register.
    params:
      - type: reg
        registers:
          - type: byte
            write: true
      - type: string
        name: list
    stack: pop

  - code: 0x52
    mnemonic: fadein
    doc: "Fades from black"
    params: []

  - code: 0x53
    mnemonic: fadeout
    doc: "Fades to black"
    params: []

  - code: 0x54
    mnemonic: se
    doc: "Plays a sound effect"
    params:
      - type: int
    stack: pop

  - code: 0x55
    mnemonic: bgm
    doc: "Plays a fanfare (clear.adx if valueA is 0, or miniclear.adx if it's 1). There is no bounds check on this; values other than 0 or 1 will result in undefined behavior."
    params:
      - type: int
    stack: pop

  - code: 0x56
    mnemonic: nop_56
    doc: "Does nothing"
    params: []

  - code: 0x57
    mnemonic: nop_57
    doc: "Does nothing"
    params: []

  - code: 0x58
    mnemonic: enable
    doc: "Does nothing"
    params:
      - type: int
    stack: pop

  - code: 0x59
    mnemonic: disable
    doc: "Does nothing"
    params:
      - type: int
    stack: pop

  - code: 0x5a
    mnemonic: window_msg
    doc: "Displays a message. Special tokens are interpolated within the string; these special tokens are: <rXX> => value of rXX as %d (signed integer) <fXX> => value of rXX as %f (floating-point) (v3 and later) <color X> => changes text color like $CX would (supported on 11/2000 and later); X must be numeric and in the range 0-7, so <color 8>, <color 9>, and <color G> do not work (though \\tC8, \\tC9, and \\tCG can be used directly in the text, and do work) <cr> => newline <hero name> or <name hero> => character's name <hero job> or <name job> => character's class <time> => always \"01:12\" (seems like an oversight that was never fixed) <award item> => name of the chosen challenge mode reward (v2 and later) <challenge title> => character's challenge rank text (v2 and later) <pl_name> => name of character selected with get_pl_name (v2 and later) <pl_job> => class of character selected with get_pl_job (v2 and later) <last_word> => challenge mode grave message (v2 and later) <team_name> => name of the game (set by 8A command) (v2 and later) <last_chat> => last chat message (v2 and later) <meseta_slot_prize> => the description of the last item sent by the server in a 6xE3 command (BB only)"
    params:
      - type: string
    stack: pop

  - code: 0x5b
    mnemonic: add_msg
    doc: "Adds a message to an existing message (or window_msg). Tokens are interpolated as for window_msg."
    params:
      - type: string
    stack: pop

  - code: 0x5c
    mnemonic: mesend
    doc: "Closes the current message box"
    params: []

  - code: 0x5d
    mnemonic: gettime
    doc: "Gets the current time, in seconds since 00:00:00 on 1 January 2000"
    params:
      - type: reg
        registers:
          - type: int
            write: true

  - code: 0x5e
    mnemonic: winend
    doc: "Closes a window_msg"
    params: []

  - code: 0x60
    mnemonic: npc_crt_v3
    doc: "Creates an NPC as client ID 1. Sends 6x69 with command = 0"
    params:
      - type: int
        name: "initial state"
        doc: "initial state (see npc_crp; 0 = alive, 1 = dead, 2 = invisible text box)"
      - type: int
        name: "template index"
        doc: "template index (see 6x69 in CommandFormats.hh)"
    stack: pop

  - code: 0x61
    mnemonic: npc_stop
    doc: "Tells an NPC (by client ID) to stop following"
    params:
      - type: int
    stack: pop

  - code: 0x62
    mnemonic: npc_play
    doc: "Tells an NPC (by client ID) to follow the player"
    params:
      - type: int
    stack: pop

  - code: 0x63
    mnemonic: npc_kill
    doc: "Destroys an NPC (by client ID)"
    params:
      - type: int
    stack: pop

  - code: 0x64
    mnemonic: npc_nont
    doc: "Disables or enables the ability to talk to NPCs"
    params: []

  - code: 0x65
    mnemonic: npc_talk
    doc: "Disables or enables the ability to talk to NPCs"
    params: []

  - code: 0x66
    mnemonic: npc_crp_v3
    doc: "Creates an NPC as client ID 1. Sends 6x69 with command = 0. valueB is required in pre-v3 but is ignored"
    params:
      - type: reg
        registers:
          - type: int
            read: true
            name: "position X"
          - type: any
            read: true
            name: "position Y"
          - type: any
            read: true
            name: "position Z"
          - type: ilabel
            read: true
            name: "angle"
          - type: any
            read: true
            name: "initial state"
            doc: "initial state (0 = alive, 1 = dead, 2 = invisible text box, according to qedit.info)"
          - type: any
            read: true
            name: "template index"
            doc: "template index (see 6x69 in CommandFormats.hh)"

  - code: 0x68
    mnemonic: create_pipe
    doc: "Creates a pipe. valueA is client ID"
    params:
      - type: int
    stack: pop

  - code: 0x69
    mnemonic: p_hpstat_v3
    doc: "Checks player HP, but not in a straightforward manner: sets regA to 1 if (current_hp / max_hp) < (1 / valueA) for the client specified by valueB. Sets regA to 0 otherwise."
    params:
      - type: reg
        registers:
          - type: int
            read: true
      - type: int
        name: "client ID"
    stack: pop

  - code: 0x6a
    mnemonic: p_dead_v3
    doc: "Sets regA to 1 if player in slot (valueB) is dead, or 0 if alive."
    params:
      - type: reg
        registers:
          - type: int
            write: true
      - type: int
        name: slot
    stack: pop

  - code: 0x6b
    mnemonic: p_disablewarp
    doc: "Disables/enables telepipes/Ryuker"
    params: []

  - code: 0x6c
    mnemonic: p_enablewarp
    doc: "Disables/enables telepipes/Ryuker"
    params: []

  - code: 0x6d
    mnemonic: p_move_v3
