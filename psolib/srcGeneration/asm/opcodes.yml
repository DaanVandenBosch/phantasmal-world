  - code: 0xf801
    mnemonic: set_chat_callback
    doc: "Creates a region that calls a label if a specified string is said (via chat) by a player within the region. This is implemented by the TOChatSensor object; see that object's comments on Map.cc for details. If the trigger string contains any newlines (\\n), it is truncated at the first newline. Before matching, the game prepends and appends a single space to the chat message (presumably so that callers can use strings like \" word \" to avoid matching substrings of longer words) and transforms the chat message to lowercase, so strB should not contain any uppercase letters. The lowercasing logic (probably accidentally) also affects some symbols, as follows: [ => { \\ => | ] => } ^ => ~ _ => <DEL> Curiously, the function that checks for matches appears to be used incorrectly. The function takes an array of char[0x20] and returns the index of the string that matched, or -1 if none matched. This list of match strings is expected to end with an empty string, but TOChatSensor doesn't correctly terminate it this way. However, the following field is the TQuestThread pointer, which is non-null only if the sensor has already triggered, so it doesn't misbehave"
    params:
      - type: reg
        registers:
          - type: int
            read: true
            name: "location X"
          - type: int
            read: true
            name: "location Y"
          - type: int
            read: true
            name: "location Z"
          - type: int
            read: true
            name: "radius"
          - type: int
            read: true
            name: "label index"
