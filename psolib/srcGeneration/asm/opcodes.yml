  - code: 0xf848
    mnemonic: give_damage_score
    doc: "These are used to set the scores for each type of action in battle mode. The value used in each of these are regsA[0] + (regsA[1] / regsA[2]), treated as a floating-point value. For example, one way to specify the value 3.4 would be to set regsA to {3, 2, 5}. These values are not reset between battle quests or upon joining/leaving games, so battle quests should always explicitly set these! The scores which can be set are: ba_player_give_damage_score: Score earned per point of damage given to other players. (Default 0.05) ba_player_take_damage_score: Score lost per point of damage taken from other players. (Default 0.02) ba_enemy_give_damage_score: Score earned per point of damage given to non-player enemies. (Default 0.01) ba_enemy_take_damage_score: Score lost per point of damage taken from non-player enemies. (Default 0) ba_player_kill_score: Score earned by killing another player. (Default 10) ba_player_death_score: Score lost by dying to another player. (Default 7) ba_enemy_kill_score: Score earned by killing a non-player enemy. (Default 3) ba_enemy_death_score: Score lost by dying to a non-player enemy. (Default 7) ba_meseta_score: Score earned per Meseta in the player's inventory. (Default 0)"
    params:
      - type: reg
        registers:
          - type: int
            write: true

