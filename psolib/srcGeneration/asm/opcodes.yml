          - type: int
            write: true
            name: "symbol chat data [4]"
          - type: int
            write: true
            name: "symbol chat data [5]"
          - type: int
            write: true
            name: "symbol chat data [6]"
          - type: int
            write: true
            name: "symbol chat data [7]"
          - type: int
            write: true
            name: "symbol chat data [8]"
